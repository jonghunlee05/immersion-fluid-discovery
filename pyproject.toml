[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immersion-fluid-discovery"
version = "0.1.0"
description = "Experimental data construction tools for single-phase immersion fluid discovery."
requires-python = ">=3.11"
dependencies = [
    "rdkit==2026.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
